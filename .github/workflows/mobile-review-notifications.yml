name: Mobile Review Notifications Monitor

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Optional reason for a manual monitor tick."
        required: false
        type: string

concurrency:
  group: mobile-review-notifications-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    env:
      MONITOR_URL: ${{ secrets.MOBILE_REVIEW_NOTIFICATION_MONITOR_URL }}
      MONITOR_SECRET: ${{ secrets.MOBILE_NOTIFICATION_MONITOR_SECRET }}
    steps:
      - name: Post monitor tick
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$MONITOR_URL" || -z "$MONITOR_SECRET" ]]; then
            echo "Mobile review notification monitor is not configured; skipping tick."
            exit 0
          fi

          curl --fail --silent --show-error \
            --max-time 10 \
            --request POST "$MONITOR_URL" \
            --header "Authorization: Bearer $MONITOR_SECRET" \
            --header "Content-Type: application/json" \
            --data '{"source":"github-actions","workflow":"mobile-review-notifications"}'
