name: DailyKanji
options:
  bundleIdPrefix: dev.local
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "3"
    DEVELOPMENT_TEAM: F5U46464YH
    MARKETING_VERSION: "0.1.2"
    SWIFT_VERSION: "5.10"
targets:
  DailyKanji:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: App
      - path: App/Resources
        buildPhase: resources
        excludes:
          - .gitkeep
    dependencies:
      - target: DailyKanjiWidgetExtension
        embed: true
    settings:
      base:
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.daily-kanji
        PRODUCT_MODULE_NAME: DailyKanji
        PRODUCT_NAME: Daily Kanji
        TARGETED_DEVICE_FAMILY: "1"
  DailyKanjiWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: WidgetExtension
      - path: App/Resources
        buildPhase: resources
        excludes:
          - .gitkeep
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        INFOPLIST_FILE: WidgetExtension/Info.plist
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.daily-kanji.widget
        PRODUCT_MODULE_NAME: DailyKanjiWidgetExtension
        PRODUCT_NAME: Daily Kanji Widget
        SKIP_INSTALL: YES
  DailyKanjiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: DailyKanji
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.daily-kanji.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Daily Kanji.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Daily Kanji"
schemes:
  DailyKanji:
    build:
      targets:
        DailyKanji: all
        DailyKanjiWidgetExtension: all
        DailyKanjiTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DailyKanjiTests
    archive:
      config: Release
