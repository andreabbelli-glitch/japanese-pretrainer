<!doctype html>
<html lang="ja">
  <body>
    <section class="sectionMargin01">
      <div border="0" cellspacing="0" cellpadding="0" class="cardDetail">
        <div class="card-itself">
          <div class="row">
            <div class="small-12 columns">
              <h3 class="card-name">
                天災 デドダム<span class="packname">(DM25RP4 T7/T10)</span>
              </h3>
            </div>
          </div>
          <div class="row">
            <div class="small-12 medium-4 column">
              <div class="card">
                <div class="card-img">
                  <img
                    src="/wp-content/card/cardimage/dm25rp4-T07.jpg"
                    alt="天災 デドダム"
                  />
                </div>
              </div>
            </div>
            <div class="grid small-12 medium-8 column">
              <table>
                <tbody>
                  <tr>
                    <th><p>カードの種類</p></th>
                    <td class="type">クリーチャー</td>
                    <th><p>文明</p></th>
                    <td class="civil">水/闇/自然</td>
                  </tr>
                </tbody>
              </table>
              <table>
                <tbody>
                  <tr>
                    <th><p>レアリティ</p></th>
                    <td class="rarelity">R</td>
                    <th><p>パワー</p></th>
                    <td class="power">3000</td>
                  </tr>
                </tbody>
              </table>
              <table>
                <tbody>
                  <tr>
                    <th><p>コスト</p></th>
                    <td class="cost">3</td>
                    <th><p>マナ</p></th>
                    <td class="mana">1</td>
                  </tr>
                </tbody>
              </table>
              <table>
                <tbody>
                  <tr>
                    <th><p>種族</p></th>
                    <td class="race">トリニティ・コマンド/侵略者</td>
                  </tr>
                </tbody>
              </table>
              <table>
                <tbody>
                  <tr>
                    <th class="illusttitle">イラストレーター</th>
                    <td colspan="3" class="illusttxt">otumami</td>
                  </tr>
                </tbody>
              </table>
              <table>
                <tbody>
                  <tr>
                    <th class="full"><p>特殊能力</p></th>
                  </tr>
                  <tr>
                    <td class="skills full">
                      <li>
                        このクリーチャーが出た時、自分の山札の上から３枚を見る。その中から１枚を手札に加え、１枚をマナゾーンに置き、残りの１枚を墓地に置く。
                      </li>
                    </td>
                  </tr>
                </tbody>
              </table>
              <table>
                <tbody>
                  <tr>
                    <th class="full"><p>フレーバー</p></th>
                  </tr>
                  <tr>
                    <td class="flavor full">その愛は、天才に注がれる。</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </section>

</html>
