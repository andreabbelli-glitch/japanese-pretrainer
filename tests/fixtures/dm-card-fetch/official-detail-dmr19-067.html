<!doctype html>
<html lang="ja">
  <body>
    <section class="sectionMargin01">
      <div border="0" cellspacing="0" cellpadding="0" class="cardDetail">
        <div class="card-itself">
          <div class="row">
            <div class="small-12 columns">
              <h3 class="card-name">
                トリガ・トリカマ<span class="packname">(DMR19 67/87)</span>
              </h3>
            </div>
          </div>
          <div class="row">
            <div class="small-12 medium-4 column">
              <div class="card">
                <div class="card-img">
                  <img
                    src="/wp-content/card/cardimage/dmr19-067.jpg"
                    alt="トリガ・トリカマ"
                  />
                </div>
              </div>
            </div>
            <div class="grid small-12 medium-8 column">
              <table>
                <tbody>
                  <tr>
                    <th><p>カードの種類</p></th>
                    <td class="type">クリーチャー</td>
                    <th><p>文明</p></th>
                    <td class="civil">闇</td>
                  </tr>
                </tbody>
              </table>
              <table>
                <tbody>
                  <tr>
                    <th><p>レアリティ</p></th>
                    <td class="rarelity">C</td>
                    <th><p>パワー</p></th>
                    <td class="power">4000</td>
                  </tr>
                </tbody>
              </table>
              <table>
                <tbody>
                  <tr>
                    <th><p>コスト</p></th>
                    <td class="cost">4</td>
                    <th><p>マナ</p></th>
                    <td class="mana">1</td>
                  </tr>
                </tbody>
              </table>
              <table>
                <tbody>
                  <tr>
                    <th><p>種族</p></th>
                    <td class="race">ファンキー・ナイトメア</td>
                  </tr>
                </tbody>
              </table>
              <table>
                <tbody>
                  <tr>
                    <th class="illusttitle">イラストレーター</th>
                    <td colspan="3" class="illusttxt">Furuya</td>
                  </tr>
                </tbody>
              </table>
              <table>
                <tbody>
                  <tr>
                    <th class="full"><p>特殊能力</p></th>
                  </tr>
                  <tr>
                    <td class="skills full">
                      <li>
                        <img
                          src="/wp-content/uploads/card_list_strigger.png"
                          alt=""
                        />
                        S・トリガー（このクリーチャーをシールドゾーンから手札に加える時、コストを支払わずにすぐ召喚してもよい）
                      </li>
                      <li>
                        <img
                          src="/wp-content/uploads/card_list_block.png"
                          alt=""
                        />ブロッカー（このクリーチャーをタップして、相手クリーチャーの攻撃先をこのクリーチャーに変更してもよい）
                      </li>
                      <li>このクリーチャーは攻撃できない。</li>
                    </td>
                  </tr>
                </tbody>
              </table>
              <table>
                <tbody>
                  <tr>
                    <th class="full"><p>フレーバー</p></th>
                  </tr>
                  <tr>
                    <td class="flavor full"></td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </section>

</html>
