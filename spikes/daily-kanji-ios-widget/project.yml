name: DailyKanjiWidgetSpike
options:
  bundleIdPrefix: dev.local
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    SWIFT_VERSION: "5.10"
targets:
  DailyKanjiWidgetSpike:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - target: DailyKanjiWidgetExtension
        embed: true
    settings:
      base:
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.daily-kanji-spike
        PRODUCT_NAME: Daily Kanji Spike
        TARGETED_DEVICE_FAMILY: "1"
  DailyKanjiWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: WidgetExtension
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        INFOPLIST_FILE: WidgetExtension/Info.plist
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.daily-kanji-spike.widget
        PRODUCT_MODULE_NAME: DailyKanjiWidgetExtension
        PRODUCT_NAME: Daily Kanji Widget
        SKIP_INSTALL: YES
schemes:
  DailyKanjiWidgetSpike:
    build:
      targets:
        DailyKanjiWidgetSpike: all
        DailyKanjiWidgetExtension: all
    run:
      config: Debug
    archive:
      config: Release

